[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "an-kla-memory"
dynamic = ["version"]
description = "Local revisioned memory for AI-agent projects"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "The AN-KLA Memory Authors"}]

[project.optional-dependencies]
# Sólo para la suite. El runtime no tiene dependencias y no debe adquirirlas:
# `jsonschema` valida schemas publicados en los tests, nunca en producción.
test = ["jsonschema>=4.18"]
# Perfil sellado (issue #46, T1). Se DECLARA pero no se instala con el core:
# sin este extra, `an_kla.sealed.sealed_available` es False y todo comando
# sellado falla cerrado con `SealedExtraNotInstalledError` (código canónico
# `sealing_extra_not_installed`). La detección es perezosa: `cryptography`
# jamás se importa a nivel top-level del core.
sealed = ["cryptography>=42"]

[project.scripts]
an-kla = "an_kla.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "an_kla.version.VERSION"}

[tool.setuptools]
packages = ["an_kla", "an_kla.schemas", "an_kla.sealed"]

[tool.setuptools.package-data]
"an_kla" = ["resources/retrieval-benchmark-v2/*.json", "resources/retrieval-benchmark-v2/*.jsonl"]
"an_kla.schemas" = ["*.json"]
