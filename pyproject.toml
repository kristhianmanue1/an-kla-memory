[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "an-kla-memory"
version = "0.1.0a3"
description = "Local revisioned memory for AI-agent projects"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "The AN-KLA Memory Authors"}]

[tool.setuptools]
packages = ["an_kla"]
