schema: pinax/project-manifest/v1
id: an-kla-memory
proposito: >
  Memoria local para proyectos con agentes de IA: conserva hechos, eventos,
  episodios y el estado de trabajo en revisiones inmutables; recupera contexto
  bajo presupuesto y expone una escritura gobernada mediante un plan verificable.
consumidor_principal: agente

ofrece:
  - memoria local .an-kla/ por proyecto con streams facts, events y episodes en revisiones inmutables content-addressed y puntero CURRENT
  - recuperación multi-stream opt-in bajo presupuesto explícito en bytes UTF-8 con índice FTS5 y transparencia de exclusiones
  - ensamblado de contexto con presupuesto y señal de primera clase para la selección vacía por cero solapamiento léxico
  - escritura gobernada en dos fases (plan-write -> commit-write-plan) con autoridad separada del candidato, compare-and-swap y lock local
  - checkpoints gobernados (checkpoint plan -> commit) ligados a la revisión vigente, con checkpoint genésico creado por init
  - "resume: handoff consistente y limitado por bytes que separa snapshot y delta vivo sin mutar el store"
  - verify de integridad del store y consulta de disponibilidad histórica por revisión
  - startup-diagnostic read-only que expone el vocabulario del store para que un agente fresco formule queries
  - integration status observable por ejes (store, contexto gestionado, modo, perfil host-hooks)
  - contexto gestionado - bloque administrado en AGENTS.md con flujo context plan/install/status y plantilla en un eje de versión separado del paquete
  - "attest: acuñación local de receipts HMAC-SHA256 que convierten observación en autoridad tool_observed bajo whitelist fail-closed"
  - refute gobernado - conserva el record original y añade un overlay auditable sin fabricar sucesor
  - export/restore verificable - bundle ligado a identidad y CURRENT, con restore no-replace fail-closed
  - "perfil sellado sealed-export/v1: bundles cifrados en reposo (AES-256-GCM) con adaptador externo de claves"
  - compactación gobernada - corte de epoch, tombstones, restore proof y catálogos acumulativos
  - subjects - subject_ref con namespace derivado de la identidad y binding bajo lock; vista contextual derivada paginada y non-authoritative
  - upgrade gobernado del contrato administrado (inspect/apply/verify) con fingerprints, target drift explícito y adopción de baseline
  - identidad lógica de proyecto y store con adopción explícita de stores legacy
  - inventario físico por revisión, metadata-only y paginado
  - transacciones con outcome separado de autoridad, auditoría y durabilidad (inspect read-only, repair-durabilidad gobernado)
  - servidor MCP de sólo lectura
  - schemas normativos embebidos en el paquete, consultables con schema list/schema show
  - verificación no bloqueante de versiones contra GitHub Releases, de sólo lectura y desactivable
  - benchmark reproducible de ranking y presupuesto de recuperación

no_ofrece:
  - "garantías de identidad, autoría o verdad: la memoria no prueba nada del mundo externo y sus datos deben revalidarse antes de actuar"
  - "hogar para estado canónico de aplicaciones: cuentas, permisos, configuración operacional, inventarios completos ni secretos (prueba de amputación: si borrar .an-kla rompe el producto, ese dato necesita otro hogar)"
  - coordinación entre máquinas o varias memorias activas - una sola memoria por proyecto y el lock de escritura es local
  - autoactualizarse o ejecutar el gestor de paquetes - el aviso de versiones es informativo y el operador decide
  - administración de archivos de proveedores - sólo administra el AGENTS.md raíz del proyecto
  - "GC automático o compactación implícita: la compactación es explícita, gobernada y destructiva; exige export verificable, autoridad y plan exacto"
  - confidencialidad del store vivo o del transporte en el perfil sellado - cifra el bundle en reposo y no es atestación de origen
  - autoridad privilegiada autodeclarada para refute - la resuelve un host confiable, nunca el CLI por sí mismo
  - operaciones de escritura más allá de add y supersede dentro de write-policy/v1 - refute y decay producen skip y el estado eliminada no tiene operación gobernada
  - el comando write legado, retirado - el flujo público es plan-write -> commit-write-plan
  - generación de proposals o authorities para el flujo gobernado
  - distribución desde PyPI - sólo etiquetas Git exactas del repositorio
  - soporte de Windows - diferido por decisión del operador
  - sustituir Git, las pruebas, la revisión humana o la autoridad vigente del usuario

