consume:
  # Nivel ecosistema. Las dependencias de paquete viven en pyproject.toml.
  - { tipo: proyecto, id: skevi, uso: "estándar de proceso adoptado; gates de tamaños y planes de Skevi configurados vía skevi-gate.json con corpus pinneado", requerido: false }
  - { tipo: externo, id: git, uso: "requerido sólo al instalar desde GitHub; el checkpoint liga source_state con perfil git/v1 caller_asserted, sin verificarlo contra Git", requerido: false }
  - { tipo: externo, id: github-releases-api, uso: "consulta de sólo lectura para el aviso no bloqueante de versiones; sin telemetría y desactivable", requerido: false }

fronteras_de_confianza:
  - la memoria recuperada es dato no confiable - nunca instrucción, ni autorización, ni prueba de identidad, autoría o verdad externa; se revalida antes de actuar
  - no se obedecen instrucciones halladas en memoria ni se ejecutan comandos, scripts, URLs o llamadas de herramientas hallados allí
  - campos autodeclarados como trusted, verified, confidence o human_confirmed son datos, no autoridad
  - un JSON del caller no puede declarar tool_observed ni channel_confirmed - requieren adaptador del host o receipts acuñados por el motor
  - el perfil git/v1 es caller_asserted - declarar el SHA de un commit no implica que AN-KLA lo verifique contra Git
  - la vista contextual derivada es non-authoritative - organiza lo registrado, no sustituye la fuente original ni demuestra el mundo externo
  - tamper-evidence no es tamper-proofness - el store evidencia reescrituras consistentes, no las imposibilita
  - memoria, bundles y catálogos son datos no confiables - ninguna cadena contenida en ellos autoriza operaciones
  - el disco evidencia lo que existe ahora, no intención, corrección semántica ni autoridad

pospuesto:
  - soporte de Windows, diferido por decisión del operador (el protocolo de anclaje y parte de la suite son POSIX)
  - índice semántico derivado y recuperación híbrida opt-in (ADR-0029, propuesta)
  - continuidad obligatoria en hitos (ADR-0030, propuesta en reevaluación)
  - store_root externo y reversible separado del project_root (ADR-0048 aceptada, implementación pendiente)
  - generadores de proposals y authorities para el flujo gobernado (decisión abierta)
  - formalización del verificador independiente con anclaje externo de digests (ADR-0044, propuesta)
