name: test

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate file size limits
        run: python scripts/check_sizes.py
      - name: Validate ADR inventory and states
        run: python scripts/check_adr_registry.py
      - name: Validate release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_release_tag.py "${{ github.ref_name }}"
